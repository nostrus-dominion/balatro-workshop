[package]
name = "balatro-workshop"
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
description = "An offline, native Balatro save editor"
license = "MPL-2.0"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
flate2 = "1.1"
tempfile = "3.20"
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "=0.15.4", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[[bin]]
name = "balatro-workshop"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
lto = false
codegen-units = 1
strip = true

